[workspace]
resolver = "2"
members = [
    "crates/tokenisers_core",
    "crates/tokenisers_py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80.0"
license = "MIT OR Apache-2.0"
authors = ["Tokenisers Contributors"]
repository = "https://github.com/Andy34G7/tokenisers"
readme = "README.md"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parallelism & Concurrency
rayon = "1.10"
parking_lot = "0.12.5"

# Fast Hashing & PRNG
ahash = "0.8"
fastrand = "2.3"

# Error Handling & Logging
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

# Python Bindings
pyo3 = { version = "0.23", features = ["extension-module"] }

# Testing & Benchmarking
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = false
strip = true

[profile.dev]
opt-level = 1
debug = true

[profile.bench]
opt-level = 3
lto = "thin"
